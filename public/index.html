<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#060a1f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="N &amp; A" />
  <meta name="application-name" content="N &amp; A" />
  <title>Nourah &amp; Aziz</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js" defer></script>
</head>
<body class="is-locked">
  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="orb orb--rose"></div>
    <div class="orb orb--sky"></div>
    <div class="orb orb--indigo"></div>
    <div class="grain"></div>
  </div>

  <!-- ============================ LOCK SCREEN ============================ -->
  <section class="lock" id="lock" aria-label="Private entry">
    <div class="lock__inner">
      <div class="monogram" aria-hidden="true">
        <span class="monogram__n">N</span>
        <span class="monogram__amp">&amp;</span>
        <span class="monogram__a">A</span>
      </div>
      <p class="lock__eyebrow">Private</p>
      <h1 class="lock__title">Just the two of us</h1>

      <div class="dots" id="dots" role="status" aria-live="polite" aria-label="Passcode, 0 of 6 digits entered">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <p class="lock__message" id="lockMessage">Enter your passcode</p>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1" type="button">1</button>
        <button class="key" data-key="2" type="button">2</button>
        <button class="key" data-key="3" type="button">3</button>
        <button class="key" data-key="4" type="button">4</button>
        <button class="key" data-key="5" type="button">5</button>
        <button class="key" data-key="6" type="button">6</button>
        <button class="key" data-key="7" type="button">7</button>
        <button class="key" data-key="8" type="button">8</button>
        <button class="key" data-key="9" type="button">9</button>
        <span class="key key--ghost" aria-hidden="true"></span>
        <button class="key" data-key="0" type="button">0</button>
        <button class="key key--action" data-key="back" type="button" aria-label="Delete">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-6-6 6-6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m12.5 10 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="lock__veil"></div>
  </section>

  <!-- ============================ APP ============================ -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand-mark"><i class="c-rose">N</i><em>&amp;</em><i class="c-sky">A</i></span>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-view="today" aria-selected="true">Today</button>
        <button class="tab" role="tab" data-view="balance" aria-selected="false">Balance</button>
        <button class="tab" role="tab" data-view="moments" aria-selected="false">Moments</button>
        <span class="tabs__glider" aria-hidden="true"></span>
      </nav>
      <div class="topbar__actions">
        <span class="save-state" id="saveState" aria-live="polite"></span>
        <button class="icon-btn" id="lockBtn" type="button" aria-label="Lock">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="views">
      <!-- TODAY -->
      <section class="view is-active" id="view-today" data-view="today">
        <div class="day-hero">
          <button class="nav-arrow" id="prevDay" type="button" aria-label="Previous day">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="day-hero__text">
            <p class="eyebrow" id="dayEyebrow">Today</p>
            <h2 class="day-hero__title" id="dayTitle">—</h2>
            <p class="day-hero__sub" id="daySub"></p>
          </div>
          <button class="nav-arrow" id="nextDay" type="button" aria-label="Next day">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="day-meta">
          <div class="progress" aria-hidden="true">
            <svg viewBox="0 0 40 40"><circle class="progress__track" cx="20" cy="20" r="17"/><circle class="progress__bar" id="progressBar" cx="20" cy="20" r="17"/></svg>
          </div>
          <p id="progressText">Nothing written yet</p>
          <button class="chip" id="goToday" type="button" hidden>Back to today</button>
        </div>

        <div class="day-verdict" id="dayVerdict" hidden></div>

        <div class="questions" id="questions"></div>
      </section>

      <!-- BALANCE -->
      <section class="view" id="view-balance" data-view="balance" hidden>
        <div class="section-head">
          <p class="eyebrow">Who did it more</p>
          <h2 class="section-title">The balance</h2>
          <div class="segmented" id="rangeSeg" role="radiogroup" aria-label="Range">
            <button type="button" data-range="7" role="radio" aria-checked="false">7 days</button>
            <button type="button" data-range="30" role="radio" aria-checked="true" class="is-active">30 days</button>
            <button type="button" data-range="all" role="radio" aria-checked="false">All time</button>
          </div>
        </div>
        <div id="balance"></div>
      </section>

      <!-- MOMENTS -->
      <section class="view" id="view-moments" data-view="moments" hidden>
        <div class="section-head">
          <p class="eyebrow">Every day, kept</p>
          <h2 class="section-title">Moments</h2>
        </div>
        <div class="moments" id="moments"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
